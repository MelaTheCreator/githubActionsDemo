# Name des Workflows, erscheint im Github Actions Tab
name: Run Jest Test

# Wann soll der Workflow ausgeführt werden
on:
  push:
    branches:
      - main # Bei jedem push auf den main-Branch
  pull_request:
    branches:
      - main # Und bei jedem Pull-Request gegen main

jobs:
  test: # Ein einzelner Job mit dem Namen test
    runs-on: ubuntu-latest # GitHub stellt eine frische Ubuntu-VM bereit

    steps:
      # Schritt 1: Repository-Code in die VM clonen
      - name: Checkout code
        uses: actions/checkout@v4

      # Schritt 2: Node.js installieren
      - name: Set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Schritt 3: Depenencies installieren
      # ci damit exact die Versionen der package.lock.json genommen werden
      - name: Install dependencies
        run: npm ci

      # Schritt 4: Jest Tests ausführen
      - name: Run tests
        run: npm test
